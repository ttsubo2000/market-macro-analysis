name: CI

on:
  pull_request:
    branches:
      - main
      - phase/**

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short --cov=market_macro_analysis --cov-report=term-missing

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Create estat-api.toml
        run: |
          cat > estat-api.toml << EOF
          [estat-api]
          app_id = "${{ secrets.ESTAT_APP_ID }}"
          EOF

      - name: Run e2e tests
        run: uv run pytest tests/e2e/ -m e2e -v -s --no-cov

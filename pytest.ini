[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    e2e: End-to-end tests (requires real API access)

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=market_macro_analysis
    --cov-report=html
    --cov-report=term-missing
    --ignore=tests/e2e

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
